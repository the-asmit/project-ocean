<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocean-Viz — real-data spike</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #05070d; }
      body { font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
      .hud {
        position: fixed; top: 10px; left: 12px; z-index: 10;
        color: #9db4d8; font-size: 12px; line-height: 1.5; letter-spacing: .02em;
        pointer-events: none; text-shadow: 0 1px 2px #000;
      }
      .hud b { color: #dfe9fb; }
      .hud .warn { color: #ffcf7a; }
      /* P3: synthetic-vs-real disclosure must always be legible */
      .hud .src {
        display: inline-block; margin-top: 3px; padding: 3px 7px;
        border-left: 2px solid #ffcf7a; background: rgba(255, 207, 122, .09);
        color: #e2c99a; max-width: 78ch; line-height: 1.45;
      }
      .hud .src b { color: #ffcf7a; }
      .legend {
        position: fixed; bottom: 12px; left: 12px; z-index: 10;
        color: #9db4d8; font-size: 11px; pointer-events: none; text-shadow: 0 1px 2px #000;
      }
      .bar {
        width: 220px; height: 10px; border-radius: 3px; margin-top: 3px;
        background: linear-gradient(90deg,
          rgb(8,26,107), rgb(26,140,217), rgb(89,209,140),
          rgb(250,217,77), rgb(235,64,38));
      }
      .bar-labels { display: flex; justify-content: space-between; width: 220px; }
      .msg {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30;
        color: #cfe0ff; font-size: 14px; text-align: center;
      }
      .err {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30;
        color: #ff8080; background: #1a0e0e; padding: 16px 20px;
        border: 1px solid #ff5c5c; border-radius: 8px; font-size: 14px; max-width: 64ch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
